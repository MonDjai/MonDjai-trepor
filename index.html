<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* =========================================================
     MonDjai/Trépor — Sprints 1 et 2
     Sprint 1 : configuration initiale, saisie du jour, calcul automatique.
     Sprint 2 : tableau de bord "Aujourd'hui" (onglet), écran "Mon état"
     (semaine/mois : recette totale, charges par rubrique, solde cumulé,
     moyenne journalière) et historique des jours passés en lecture seule.
     Tout est stocké en localStorage. Aucun appel réseau.
  ========================================================= */

  var STORAGE_KEY = "trepor_state_v1";

  var RUBRIQUES_DEFAUT = [
    { id:"dioulatchai",    nom:"Dioulatchai (part propriétaire)", icone:"🔑", couleur:"#f5a623", parDefautLocataire:true },
    { id:"carburant",      nom:"Carburant",                       icone:"⛽", couleur:"#e5533c", parDefautLocataire:false },
    { id:"assurance",      nom:"Assurance",                       icone:"🛡️", couleur:"#4c8bf5", parDefautLocataire:false },
    { id:"syndicat",       nom:"Syndicat",                        icone:"🤝", couleur:"#34b37e", parDefautLocataire:false },
    { id:"taxe_communale", nom:"Taxe communale",                  icone:"🏛️", couleur:"#9b6bd6", parDefautLocataire:false },
    { id:"droit_sol",      nom:"Droit de sol",                    icone:"📍", couleur:"#e0578a", parDefautLocataire:false },
    { id:"lavage",         nom:"Lavage",                          icone:"🧽", couleur:"#35b4c9", parDefautLocataire:null }, // pas coché par défaut
    { id:"entretien",      nom:"Entretien (pneu, panne, vidange)",icone:"🔧", couleur:"#c9a227", parDefautLocataire:false }
  ];

  var SEGMENTS = [
    { id:"taxi_compteur", nom:"Taxi compteur", emoji:"🚕" },
    { id:"wow",           nom:"Wôrô-wôrô",      emoji:"🚗" },
    { id:"moto_taxi",     nom:"Moto-taxi",      emoji:"🏍️" },
    { id:"vtc_yango",     nom:"VTC (Yango)",    emoji:"📱" }
  ];

  var EMOJI_CHOICES = ["💧","🍔","📱","🧯","🧾","🚔","🅿️","🛞","🧴","🧰","🧊","💊","🏠","🐔","☕","➕"];
  var COLOR_CHOICES = ["#f5a623","#e5533c","#4c8bf5","#34b37e","#9b6bd6","#e0578a","#35b4c9","#c9a227","#7f8c9a"];

  var MAX_RUBRIQUES_CONSEILLE = 10;

  // Dimensions de l'image générée par l'écran "Partager" (F8).
  var SHARE_W = 1080;
  var SHARE_H = 1350;

  var MODELES_OBJECTIF = [
    { id:"vehicule", nom:"Véhicule",         emoji:"🏍️", desc:"Moto, apport véhicule",       sousTypes:["Moto","Apport véhicule"] },
    { id:"famille",  nom:"Famille",          emoji:"👨‍👩‍👧", desc:"Mariage, scolarité, santé",  sousTypes:["Mariage","Scolarité","Santé"] },
    { id:"filet",    nom:"Filet de sécurité",emoji:"🛟", desc:"Jour sans travail, panne, contrôle", sousTypes:["Jour sans travail","Panne","Contrôle"] },
    { id:"epargne_libre", nom:"Épargne libre", emoji:"💰", desc:"Juste mettre de côté, sans montant précis", sousTypes:[] }
  ];

  var POURCENTAGES_SCENARIO = [10,20,30];
  var NOMS_SCENARIO = { 10:"Tranquille", 20:"Équilibré", 30:"Ambitieux" };
  var NB_SEMAINES_MOYENNE = 4;
  var RAPPEL_SAUVEGARDE_JOURS = 7;

  /* ---------- État ---------- */

  var state = null;
  var ui = { screen:"loading", modal:null, modalData:{}, tab:"aujourdhui", etatPeriode:"semaine", objStep:1, objData:{}, objEditing:false, overlay:null, locked:false, lockPin:"", partagerPeriode:"jour", accueilDate:null };

  // ---------- Sprint 5A : bouton retour du téléphone (navigation, pas de sortie de l'app) ----------
  // Sans ceci, le bouton/geste "retour" du téléphone quitte directement l'application dès qu'on
  // est dans un écran secondaire (Réglages, un modal, un onglet autre qu'Aujourd'hui...). On
  // n'essaie pas de tout modéliser dans l'historique du navigateur : à chaque rendu, on regarde
  // si l'écran actuel est "profond" et on arme/désarme une seule entrée d'historique en
  // conséquence. Au retour physique, on referme la couche la plus profonde ouverte (modal, puis
  // écran secondaire, puis étape d'un assistant, puis onglet) — jamais plus d'un niveau à la fois.
  var historyArmed = false;
  var suppressNextPopstate = false;

  function isUiDeep(){
    if(!state || !state.config || !state.config.onboardingComplete) return false; // pas pendant la configuration
    if(ui.locked) return false; // pas sur l'écran de verrouillage
    if(ui.modal) return true;
    if(ui.overlay) return true;
    if(ui.tab === "objectif" && !(state.objectif && state.objectif.actif) && (ui.objStep||1) > 1) return true;
    if(ui.tab && ui.tab !== "aujourdhui") return true;
    return false;
  }

  function syncHistoryForBack(){
    if(typeof history === "undefined" || !history.pushState) return;
    var deep = isUiDeep();
    if(deep && !historyArmed){
      historyArmed = true;
      history.pushState({ trepor:true }, "", location.href);
    } else if(!deep && historyArmed){
      historyArmed = false;
      suppressNextPopstate = true;
      history.back();
    }
  }

  function handleBackNavigation(){
    if(ui.modal){ ui.modal = null; ui.modalData = {}; render(); return; }
    if(ui.overlay){ ui.overlay = null; render(); return; }
    if(ui.tab === "objectif" && !(state.objectif && state.objectif.actif) && (ui.objStep||1) > 1){
      ui.objStep -= 1; render(); return;
    }
    if(ui.tab && ui.tab !== "aujourdhui"){ ui.tab = "aujourdhui"; render(); return; }
  }

  function dateToKey(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return y + "-" + m + "-" + day;
  }

  function todayKey(){
    return dateToKey(new Date());
  }

  function defaultState(){
    return {
      version:1,
      config:{
        segment:null,
        statutVehicule:null,      // 'proprietaire' | 'locataire'
        dioulatchai:0,
        rubriques:[],             // {id, nom, icone, couleur, actif, perso}
        onboardingComplete:false,
        pinActif:false,           // verrouillage par code PIN (F10)
        pinCode:null              // code à 4 chiffres, ou null
      },
      jours:{},                   // { 'AAAA-MM-JJ': {date, origine:'trepor', recette, charges:[]} }
      dernierMontant:{},          // { rubriqueId: montant }
      objectif:null,              // { id, modele, sousType, nom, montantCible, dateCreation, pourcentage, actif }
      meta:{                      // suivi interne (sauvegarde), invisible dans l'UI hormis le rappel
        derniereSauvegarde:null,
        dernierRappelSauvegarde:null
      }
    };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed || !parsed.config) return defaultState();
      // fusion défensive si des clés manquent
      var base = defaultState();
      parsed.config = Object.assign(base.config, parsed.config);
      parsed.jours = parsed.jours || {};
      parsed.dernierMontant = parsed.dernierMontant || {};
      if(parsed.objectif === undefined) parsed.objectif = null;
      parsed.meta = Object.assign({}, base.meta, parsed.meta || {});
      return parsed;
    }catch(e){
      return defaultState();
    }
  }

  // Fusionne un objet restauré (sauvegarde JSON) dans une structure d'état complète et sûre.
  function normaliserEtatImporte(parsed){
    var base = defaultState();
    var out = {};
    out.version = parsed.version || 1;
    out.config = Object.assign({}, base.config, parsed.config || {});
    out.jours = parsed.jours || {};
    out.dernierMontant = parsed.dernierMontant || {};
    out.objectif = parsed.objectif !== undefined ? parsed.objectif : null;
    out.meta = Object.assign({}, base.meta, parsed.meta || {});
    return out;
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      showToast("Sauvegarde impossible sur cet appareil.");
    }
  }

  function ensureJour(key){
    if(!state.jours[key]){
      state.jours[key] = { date:key, origine:"trepor", recette:null, charges:[] };
      if(key !== todayKey()) state.jours[key].saisiApresCoup = true; // Sprint 5A : saisie rétroactive (F1)
      seedDioulatchaiCharge(state.jours[key]);
      // Le dioulatchai auto-ajouté est une vraie charge, pas juste un brouillon d'affichage :
      // on la sauvegarde tout de suite pour ne pas la perdre si l'appli se ferme avant toute
      // autre saisie du jour.
      if(state.jours[key].charges.length > 0) saveState();
    }
    return state.jours[key];
  }

  // Sprint 5A : si on est locataire avec un dioulatchai renseigné, la charge du jour est déjà là
  // à l'ouverture au lieu de devoir être ajoutée à la main comme les autres charges.
  function seedDioulatchaiCharge(jour){
    if(state.config.statutVehicule !== "locataire") return;
    if(!state.config.dioulatchai) return;
    var rub = state.config.rubriques.find(function(r){ return r.id === "dioulatchai"; });
    if(!rub || !rub.actif) return;
    jour.charges.push({ id:uid("charge"), rubriqueId:"dioulatchai", montant:state.config.dioulatchai, ts:Date.now() });
  }

  // Sprint 5A : quel jour est actuellement en cours de saisie sur l'accueil — aujourd'hui par
  // défaut, ou un jour passé choisi via le sélecteur de date (remarque terrain : jour oublié).
  function currentEntryKey(){
    return ui.accueilDate || todayKey();
  }

  function entryDateLabel(){
    var key = currentEntryKey();
    if(key === todayKey()) return "aujourd'hui";
    return "le " + formatDateLongue(new Date(key + "T00:00:00"));
  }

  /* ---------- Utilitaires ---------- */

  function formatFCFA(n){
    n = Math.round(Number(n) || 0);
    var neg = n < 0;
    n = Math.abs(n);
    var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (neg ? "-" : "") + s + " F";
  }

  function parseAmountInput(str){
    if(str === null || str === undefined) return 0;
    var cleaned = String(str).replace(/[^\d]/g, "");
    if(cleaned === "") return 0;
    return parseInt(cleaned, 10);
  }

  function spacedDigits(val){
    var digits = String(val==null?"":val).replace(/[^\d]/g, "");
    if(digits === "") return "";
    return digits.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }

  // Reformate un champ montant avec des espaces de milliers pendant la saisie.
  function attachAmountInput(input, onChange){
    if(!input) return;
    input.addEventListener("input", function(){
      var digits = input.value.replace(/[^\d]/g, "");
      var formatted = spacedDigits(digits);
      input.value = formatted;
      try{ input.setSelectionRange(formatted.length, formatted.length); }catch(e){}
      if(onChange) onChange(digits ? parseInt(digits,10) : 0, formatted);
    });
  }

  var JOURS_FR = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  var MOIS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

  function formatDateLongue(d){
    return JOURS_FR[d.getDay()] + " " + d.getDate() + " " + MOIS_FR[d.getMonth()] + " " + d.getFullYear();
  }

  function formatDateCourte(d){
    return d.getDate() + " " + MOIS_FR[d.getMonth()];
  }

  function capitalize(s){
    s = String(s||"");
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  // Lundi-dimanche de la semaine contenant d.
  function getWeekRange(d){
    var day = d.getDay(); // 0=dimanche..6=samedi
    var diffToMonday = (day + 6) % 7;
    var monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diffToMonday);
    var sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
    return { startDate:monday, endDate:sunday, start:dateToKey(monday), end:dateToKey(sunday) };
  }

  function getMonthRange(d){
    var first = new Date(d.getFullYear(), d.getMonth(), 1);
    var last = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return { startDate:first, endDate:last, start:dateToKey(first), end:dateToKey(last) };
  }

  // Agrège les jours ayant des données dans l'intervalle [range.start, range.end] (bornes incluses).
  function computeEtatStats(range){
    var keys = Object.keys(state.jours).filter(function(k){
      var j = state.jours[k];
      var hasData = j.recette !== null || (j.charges && j.charges.length > 0);
      return hasData && k >= range.start && k <= range.end;
    });
    var recetteTotale = 0, chargesTotales = 0, soldeCumule = 0;
    var parRubrique = {};
    keys.forEach(function(k){
      var j = state.jours[k];
      var r = j.recette || 0;
      var totalCh = 0;
      j.charges.forEach(function(c){
        parRubrique[c.rubriqueId] = (parRubrique[c.rubriqueId] || 0) + c.montant;
        totalCh += c.montant;
      });
      recetteTotale += r;
      chargesTotales += totalCh;
      soldeCumule += (r - totalCh);
    });
    var moyenne = keys.length > 0 ? soldeCumule / keys.length : 0;
    return {
      keys:keys,
      recetteTotale:recetteTotale,
      chargesTotales:chargesTotales,
      soldeCumule:soldeCumule,
      moyenne:moyenne,
      parRubrique:parRubrique
    };
  }

  function uid(prefix){
    return (prefix||"id") + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7);
  }

  function joursEntre(keyDebut, keyFin){
    var d1 = new Date(keyDebut + "T00:00:00");
    var d2 = new Date(keyFin + "T00:00:00");
    return Math.round((d2 - d1) / 86400000);
  }

  function soldeNetJour(j){
    var totalCh = (j.charges||[]).reduce(function(s,c){ return s + c.montant; }, 0);
    return (j.recette || 0) - totalCh;
  }

  function jourADesDonnees(j){
    return j.recette !== null || (j.charges && j.charges.length > 0);
  }

  // Solde net moyen réel par semaine, calculé sur les dernières semaines
  // réellement saisies (pas des semaines calendaires vides). Sert de base
  // au simulateur "3 façons d'y arriver" (F7).
  function computeMoyenneHebdoRecente(){
    var semaines = {}; // clé = lundi de la semaine (AAAA-MM-JJ)
    Object.keys(state.jours).forEach(function(k){
      var j = state.jours[k];
      if(!jourADesDonnees(j)) return;
      var d = new Date(k + "T00:00:00");
      var range = getWeekRange(d);
      if(!semaines[range.start]) semaines[range.start] = { start:range.start, soldeNet:0, nbJours:0 };
      semaines[range.start].soldeNet += soldeNetJour(j);
      semaines[range.start].nbJours += 1;
    });
    var liste = Object.keys(semaines).map(function(k){ return semaines[k]; });
    liste.sort(function(a,b){ return a.start < b.start ? 1 : -1; }); // plus récent d'abord
    var recentes = liste.slice(0, NB_SEMAINES_MOYENNE);
    var total = recentes.reduce(function(s,sem){ return s + sem.soldeNet; }, 0);
    var moyenne = recentes.length > 0 ? total / recentes.length : 0;
    return { moyenne:moyenne, nbSemaines:recentes.length };
  }

  // Calcule les 3 scénarios d'épargne hebdomadaire pour atteindre montantCible.
  function computeScenarios(montantCible){
    var info = computeMoyenneHebdoRecente();
    return POURCENTAGES_SCENARIO.map(function(pct){
      var epargneHebdo = info.moyenne > 0 ? (info.moyenne * pct / 100) : 0;
      // Épargne libre (F7, Sprint 5A) : sans montant cible, pas de durée à calculer.
      var semaines = (montantCible > 0 && epargneHebdo > 0) ? Math.ceil(montantCible / epargneHebdo) : null;
      return { pourcentage:pct, epargneHebdo:epargneHebdo, semaines:semaines };
    });
  }

  function formatDureeSemaines(sem){
    if(sem === null || sem === undefined || !isFinite(sem)) return "À déterminer";
    if(sem <= 8) return sem + (sem > 1 ? " semaines" : " semaine");
    var mois = Math.round(sem / 4.345);
    if(mois < 1) mois = 1;
    if(mois < 24) return "≈ " + mois + " mois";
    var ans = Math.round((mois / 12) * 10) / 10;
    return "≈ " + ans + (ans > 1 ? " ans" : " an");
  }

  // Épargne cumulée estimée pour l'objectif actif : pour chaque jour saisi
  // depuis la création de l'objectif, on applique le pourcentage choisi au
  // solde net de ce jour (peut réduire l'épargne un jour à perte), sans
  // jamais descendre sous zéro dans l'affichage.
  function computeEpargneObjectif(){
    if(!state.objectif || !state.objectif.actif || !state.objectif.pourcentage) return 0;
    var pct = state.objectif.pourcentage;
    var dateCreation = state.objectif.dateCreation;
    var total = 0;
    Object.keys(state.jours).forEach(function(k){
      if(k < dateCreation) return;
      var j = state.jours[k];
      if(!jourADesDonnees(j)) return;
      total += soldeNetJour(j) * pct / 100;
    });
    return Math.max(0, Math.round(total));
  }

  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function esc(str){
    return String(str==null?"":str)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  var toastTimer = null;
  function showToast(msg){
    var existing = document.querySelector(".toast");
    if(existing) existing.remove();
    var t = el('<div class="toast">'+esc(msg)+'</div>');
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.remove(); }, 2200);
  }

  /* ---------- Rendu principal ---------- */

  var app = document.getElementById("app");

  function render(){
    if(!state.config.onboardingComplete){
      renderOnboarding();
    } else if(state.config.pinActif && state.config.pinCode && ui.locked){
      renderPinLock();
    } else if(ui.overlay === "reglages"){
      renderReglagesScreen();
    } else if(ui.overlay === "apropos"){
      renderAProposScreen();
    } else {
      renderMain();
    }
    renderModal();
    syncHistoryForBack();
  }

  function renderMain(){
    if(ui.tab === "etat") renderEtat();
    else if(ui.tab === "objectif") renderObjectif();
    else if(ui.tab === "partager") renderPartager();
    else renderAccueil();
  }

  function renderTabBarHtml(active){
    return '' +
      '<div class="tabbar-wrap"><div class="tabbar">' +
        '<button class="tabbar-btn '+(active==="aujourdhui"?"active":"")+'" data-tab="aujourdhui">' +
          '<span class="tabbar-ic">🏠</span><span>Aujourd\'hui</span></button>' +
        '<button class="tabbar-btn '+(active==="etat"?"active":"")+'" data-tab="etat">' +
          '<span class="tabbar-ic">📊</span><span>Mon état</span></button>' +
        '<button class="tabbar-btn '+(active==="objectif"?"active":"")+'" data-tab="objectif">' +
          '<span class="tabbar-ic">🎯</span><span>Objectif</span></button>' +
        '<button class="tabbar-btn '+(active==="partager"?"active":"")+'" data-tab="partager">' +
          '<span class="tabbar-ic">📤</span><span>Partager</span></button>' +
      '</div></div>';
  }

  function attachTabBarEvents(){
    document.querySelectorAll("[data-tab]").forEach(function(node){
      node.addEventListener("click", function(){
        var tab = node.getAttribute("data-tab");
        if(ui.tab !== tab){
          ui.tab = tab;
          render();
        }
      });
    });
  }

  /* ===================== ONBOARDING ===================== */

  function renderOnboarding(){
    var step = ui.screen === "onb2" ? 2 : (ui.screen === "onb3" ? 3 : 1);

    var stepsHtml = '<div class="onb-steps">' +
      [1,2,3].map(function(i){
        return '<div class="onb-step-dot '+(i<=step?"done":"")+'"></div>';
      }).join("") + '</div>';

    var body = "";
    if(step === 1) body = onbStep1();
    else if(step === 2) body = onbStep2();
    else body = onbStep3();

    app.innerHTML = '<div class="onb">' + stepsHtml + body + '</div>';
    attachOnboardingEvents(step);
  }

  function onbStep1(){
    var cfg = state.config;
    var cards = SEGMENTS.map(function(s){
      var sel = cfg.segment === s.id ? "selected" : "";
      return '<div class="choice-card '+sel+'" data-segment="'+s.id+'">' +
        '<span class="emoji">'+s.emoji+'</span><span>'+esc(s.nom)+'</span></div>';
    }).join("");

    return '' +
      '<p class="onb-eyebrow">Étape 1 sur 3</p>' +
      '<h1 class="onb-title">Quel est votre activité ?</h1>' +
      '<p class="onb-sub">On adapte les rubriques de charges à votre métier.</p>' +
      '<div class="onb-grid">'+cards+'</div>' +
      '<div class="onb-spacer"></div>' +
      '<button class="btn btn-primary" id="onb1-next" '+(cfg.segment?"":"disabled")+'>Continuer</button>';
  }

  function onbStep2(){
    var cfg = state.config;
    var isLoc = cfg.statutVehicule === "locataire";
    var isProp = cfg.statutVehicule === "proprietaire";

    var dioulatchaiField = "";
    if(isLoc){
      dioulatchaiField = '' +
        '<p class="field-label">Montant habituel du dioulatchai</p>' +
        '<div class="amount-input-wrap">' +
          '<input type="text" inputmode="numeric" id="dioulatchai-input" placeholder="0" value="'+(cfg.dioulatchai?spacedDigits(cfg.dioulatchai):"")+'">' +
          '<span class="suffix">F</span>' +
        '</div>' +
        '<p class="field-help">La part que vous versez au propriétaire chaque jour. Elle sera proposée par défaut à chaque saisie, vous pourrez toujours la modifier.</p>';
    }

    return '' +
      '<p class="onb-eyebrow">Étape 2 sur 3</p>' +
      '<h1 class="onb-title">Votre véhicule</h1>' +
      '<p class="onb-sub">Cela détermine si le dioulatchai fait partie de vos charges.</p>' +
      '<div class="choice-row">' +
        '<div class="choice-card '+(isProp?"selected":"")+'" data-statut="proprietaire">' +
          '<span class="emoji">🚙</span><span>Je suis propriétaire du véhicule</span></div>' +
        '<div class="choice-card '+(isLoc?"selected":"")+'" data-statut="locataire">' +
          '<span class="emoji">🔑</span><span>Je suis locataire (je verse le dioulatchai)</span></div>' +
      '</div>' +
      dioulatchaiField +
      '<div class="onb-spacer"></div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-ghost" id="onb2-back">Retour</button>' +
        '<button class="btn btn-primary" id="onb2-next" '+(cfg.statutVehicule?"":"disabled")+'>Continuer</button>' +
      '</div>';
  }

  function onbStep3(){
    var cfg = state.config;
    var actifs = cfg.rubriques.filter(function(r){return r.actif;}).length;

    var rows = cfg.rubriques.map(function(r){
      return renderRubriqueRow(r);
    }).join("");

    var warn = actifs > MAX_RUBRIQUES_CONSEILLE
      ? '<div class="warn-msg">Trop de rubriques tue le suivi.</div>'
      : "";

    var persoForm = ui.modal === "perso-inline" ? renderPersoForm("onb3") : "";

    return '' +
      '<p class="onb-eyebrow">Étape 3 sur 3</p>' +
      '<h1 class="onb-title">Vos rubriques de charges</h1>' +
      '<p class="onb-sub">Décochez ce qui ne vous concerne pas. Vous pourrez changer cela plus tard.</p>' +
      warn +
      '<div class="rub-list">'+rows+'</div>' +
      persoForm +
      (ui.modal === "perso-inline" ? "" : '<div class="add-rub-btn" id="onb3-add-perso">＋ Ajouter une rubrique personnalisée</div>') +
      '<div class="onb-spacer"></div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-ghost" id="onb3-back">Retour</button>' +
        '<button class="btn btn-primary" id="onb3-finish">Terminer la configuration</button>' +
      '</div>';
  }

  function renderRubriqueRow(r){
    var on = r.actif ? "on" : "";
    return '<div class="rub-row '+on+'" style="--rub-color:'+r.couleur+'" data-rub-toggle="'+r.id+'">' +
      '<div class="rub-icon" style="background:'+r.couleur+'">'+r.icone+'</div>' +
      '<div class="rub-name">'+esc(r.nom)+(r.perso?'<span class="rub-note">Rubrique personnalisée</span>':'')+'</div>' +
      '<div class="switch '+on+'"></div>' +
      '</div>';
  }

  function renderPersoForm(context){
    var d = ui.modalData;
    var emojiGrid = EMOJI_CHOICES.map(function(e){
      var sel = d.icone === e ? "selected" : "";
      return '<div class="emoji-opt '+sel+'" data-emoji="'+e+'">'+e+'</div>';
    }).join("");
    var colorGrid = COLOR_CHOICES.map(function(c){
      var sel = d.couleur === c ? "selected" : "";
      return '<div class="color-opt '+sel+'" style="background:'+c+'" data-color="'+c+'"></div>';
    }).join("");

    return '' +
      '<div class="perso-form" data-context="'+context+'">' +
        '<p class="field-label" style="margin:0;">Nom de la rubrique</p>' +
        '<input type="text" class="text-input" id="perso-nom" placeholder="Ex. : Eau, Nourriture..." value="'+esc(d.nom||"")+'" maxlength="30">' +
        '<p class="field-label" style="margin:0;">Icône</p>' +
        '<div class="emoji-grid">'+emojiGrid+'</div>' +
        '<input type="text" class="text-input" id="perso-emoji-custom" placeholder="Ou collez votre propre emoji" maxlength="4" value="'+ (d.emojiCustom||"") +'">' +
        '<p class="field-label" style="margin:0;">Couleur</p>' +
        '<div class="color-grid">' + colorGrid +
          '<div class="color-custom-wrap"><input type="color" id="perso-color-custom" value="'+(d.couleur||"#f5a623")+'"></div>' +
        '</div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-ghost btn-sm" id="perso-cancel">Annuler</button>' +
          '<button class="btn btn-primary btn-sm" id="perso-save">Ajouter la rubrique</button>' +
        '</div>' +
      '</div>';
  }

  function attachOnboardingEvents(step){
    if(step === 1){
      app.querySelectorAll("[data-segment]").forEach(function(node){
        node.addEventListener("click", function(){
          state.config.segment = node.getAttribute("data-segment");
          saveState();
          renderOnboarding();
        });
      });
      var next = document.getElementById("onb1-next");
      if(next) next.addEventListener("click", function(){
        ui.screen = "onb2";
        render();
      });
    }

    if(step === 2){
      app.querySelectorAll("[data-statut]").forEach(function(node){
        node.addEventListener("click", function(){
          state.config.statutVehicule = node.getAttribute("data-statut");
          saveState();
          renderOnboarding();
          var input = document.getElementById("dioulatchai-input");
          if(input) input.focus();
        });
      });
      var dInput = document.getElementById("dioulatchai-input");
      attachAmountInput(dInput, function(value){
        state.config.dioulatchai = value;
      });
      var back = document.getElementById("onb2-back");
      if(back) back.addEventListener("click", function(){ ui.screen="onb1"; render(); });
      var next2 = document.getElementById("onb2-next");
      if(next2) next2.addEventListener("click", function(){
        saveState();
        // initialise les rubriques par défaut si pas encore fait
        if(state.config.rubriques.length === 0){
          state.config.rubriques = RUBRIQUES_DEFAUT.map(function(r){
            var actif;
            if(r.parDefautLocataire === null) actif = false;
            else if(r.parDefautLocataire === true) actif = state.config.statutVehicule === "locataire";
            else actif = true;
            return { id:r.id, nom:r.nom, icone:r.icone, couleur:r.couleur, actif:actif, perso:false };
          });
        } else {
          // met à jour dioulatchai si le statut a changé entre deux visites
          var dioul = state.config.rubriques.find(function(r){return r.id==="dioulatchai";});
          if(dioul) dioul.actif = state.config.statutVehicule === "locataire";
        }
        saveState();
        ui.screen = "onb3";
        render();
      });
    }

    if(step === 3){
      app.querySelectorAll("[data-rub-toggle]").forEach(function(node){
        node.addEventListener("click", function(){
          var id = node.getAttribute("data-rub-toggle");
          var r = state.config.rubriques.find(function(x){return x.id===id;});
          if(r){ r.actif = !r.actif; saveState(); renderOnboarding(); }
        });
      });
      var addBtn = document.getElementById("onb3-add-perso");
      if(addBtn) addBtn.addEventListener("click", function(){
        ui.modal = "perso-inline";
        ui.modalData = { nom:"", icone:"", emojiCustom:"", couleur:COLOR_CHOICES[0] };
        renderOnboarding();
      });
      attachPersoFormEvents(function(){ renderOnboarding(); }, false);
      var back3 = document.getElementById("onb3-back");
      if(back3) back3.addEventListener("click", function(){ ui.screen="onb2"; render(); });
      var finish = document.getElementById("onb3-finish");
      if(finish) finish.addEventListener("click", function(){
        state.config.onboardingComplete = true;
        // Le tout premier rappel de sauvegarde n'arrive qu'après une semaine d'usage,
        // pas dès la fin de la configuration (il n'y a encore rien à sauvegarder).
        state.meta = state.meta || {};
        state.meta.dernierRappelSauvegarde = todayKey();
        saveState();
        ui.screen = "accueil";
        ui.tab = "aujourdhui";
        render();
      });
    }
  }

  function attachPersoFormEvents(onDone, fromChargeFlow){
    var form = document.querySelector(".perso-form");
    if(!form) return;

    form.querySelectorAll("[data-emoji]").forEach(function(node){
      node.addEventListener("click", function(){
        ui.modalData.icone = node.getAttribute("data-emoji");
        ui.modalData.emojiCustom = "";
        rerenderCurrentPersoHost();
      });
    });
    form.querySelectorAll("[data-color]").forEach(function(node){
      node.addEventListener("click", function(){
        ui.modalData.couleur = node.getAttribute("data-color");
        rerenderCurrentPersoHost();
      });
    });
    var nomInput = document.getElementById("perso-nom");
    if(nomInput){
      nomInput.addEventListener("input", function(){ ui.modalData.nom = nomInput.value; });
    }
    var emojiCustom = document.getElementById("perso-emoji-custom");
    if(emojiCustom){
      emojiCustom.addEventListener("input", function(){
        ui.modalData.emojiCustom = emojiCustom.value;
        ui.modalData.icone = "";
      });
    }
    var colorCustom = document.getElementById("perso-color-custom");
    if(colorCustom){
      colorCustom.addEventListener("input", function(){
        ui.modalData.couleur = colorCustom.value;
      });
    }
    var cancel = document.getElementById("perso-cancel");
    if(cancel) cancel.addEventListener("click", function(){
      ui.modal = null;
      ui.modalData = {};
      onDone();
    });
    var save = document.getElementById("perso-save");
    if(save) save.addEventListener("click", function(){
      var nom = (ui.modalData.nom||"").trim();
      if(!nom){ showToast("Donnez un nom à la rubrique."); return; }
      var icone = ui.modalData.emojiCustom ? ui.modalData.emojiCustom.trim() : ui.modalData.icone;
      if(!icone) icone = "🏷️";
      var couleur = ui.modalData.couleur || COLOR_CHOICES[0];
      var nouvelle = { id:uid("perso"), nom:nom, icone:icone, couleur:couleur, actif:true, perso:true };
      state.config.rubriques.push(nouvelle);
      saveState();
      if(fromChargeFlow){
        // Enchaîne directement sur la saisie du montant pour cette nouvelle rubrique.
        ui.modal = "montant-charge";
        ui.modalData = { rubriqueId: nouvelle.id, montant:"" };
        renderModal();
      } else {
        ui.modal = null;
        ui.modalData = {};
        onDone();
      }
      showToast("Rubrique ajoutée.");
    });
  }

  function rerenderCurrentPersoHost(){
    if(!state.config.onboardingComplete){
      renderOnboarding();
    } else {
      renderModal();
    }
  }

  /* ===================== ACCUEIL ===================== */

  function renderAccueil(){
    var key = currentEntryKey();
    var estAujourdhui = key === todayKey();
    var jour = ensureJour(key);
    var recette = jour.recette;
    var totalCharges = jour.charges.reduce(function(s,c){ return s + c.montant; }, 0);
    var solde = (recette||0) - totalCharges;
    var enPerte = recette !== null && solde < 0;

    var objectifActif = state.objectif && state.objectif.actif ? state.objectif : null;
    var epargneJour = (objectifActif && objectifActif.pourcentage && solde > 0)
      ? Math.round(solde * objectifActif.pourcentage / 100) : 0;
    var disponible = solde - epargneJour;

    var seg = SEGMENTS.find(function(s){return s.id===state.config.segment;});

    var soldeHtml;
    if(recette === null){
      soldeHtml = '' +
        '<div class="solde-card">' +
          '<p class="solde-label">Solde net '+(estAujourdhui?"du jour":"— "+esc(formatDateCourte(new Date(key+"T00:00:00"))))+'</p>' +
          '<p class="solde-value" style="color:var(--text-dim); font-size:22px;">Saisissez d\'abord la recette</p>' +
        '</div>';
    } else {
      soldeHtml = '' +
        '<div class="solde-card '+(enPerte?"perte":"")+'">' +
          '<p class="solde-label">Solde net '+(estAujourdhui?"du jour":"— "+esc(formatDateCourte(new Date(key+"T00:00:00"))))+'</p>' +
          '<p class="solde-value '+(enPerte?"neg":"")+'">'+formatFCFA(solde)+'</p>' +
          (enPerte ? '<div class="perte-banner">Jour à perte : '+formatFCFA(Math.abs(solde))+'</div>' : '') +
          '<div class="solde-sub">' +
            '<div class="solde-sub-item"><div class="k">Recette</div><div class="v">'+formatFCFA(recette)+'</div></div>' +
            '<div class="solde-sub-item"><div class="k">Charges</div><div class="v">'+formatFCFA(totalCharges)+'</div></div>' +
          '</div>' +
          (epargneJour > 0
            ? '<div class="disponible-line">Disponible aujourd\'hui : <b>'+formatFCFA(disponible)+'</b><br>('+formatFCFA(epargneJour)+' mis de côté pour « '+esc(objectifActif.nom)+' »)</div>'
            : '') +
        '</div>';
    }

    var recetteBtnHtml = recette === null
      ? '<div class="recette-btn" id="btn-recette"><span class="ic">💰</span><div class="lbl"><div class="t1">Recette du jour</div><div class="t2">Montant encaissé '+entryDateLabel()+'</div></div></div>'
      : '<div class="recette-btn set" id="btn-recette"><span class="ic">💰</span><div class="lbl"><div class="t1">Recette du jour : '+formatFCFA(recette)+'</div><div class="t2">Toucher pour modifier</div></div></div>';

    var chargesHtml;
    if(jour.charges.length === 0){
      chargesHtml = '<div class="empty-state">Aucune charge enregistrée '+entryDateLabel()+'.</div>';
    } else {
      chargesHtml = jour.charges.slice().reverse().map(function(c){
        var r = state.config.rubriques.find(function(x){return x.id===c.rubriqueId;});
        var nom = r ? r.nom : "Rubrique supprimée";
        var icone = r ? r.icone : "🏷️";
        var couleur = r ? r.couleur : "#7f8c9a";
        return '' +
          '<div class="charge-row">' +
            '<div class="rub-icon" style="background:'+couleur+'">'+icone+'</div>' +
            '<div class="charge-info"><div class="n">'+esc(nom)+'</div></div>' +
            '<div class="charge-amount">'+formatFCFA(c.montant)+'</div>' +
            '<button class="charge-del" data-del-charge="'+c.id+'">✕</button>' +
          '</div>';
      }).join("");
    }

    // L'objectif actif reste visible en haut (jauge utile au quotidien, F5) ; l'invite à en créer
    // un, elle, est reléguée plus bas et allégée — c'est un service optionnel, pas une étape du
    // jour (remarque terrain : l'ancien emplacement le faisait passer pour obligatoire).
    var objectifActifHtml = objectifActif ? renderObjectifDashboardCard() : "";
    var objectifInviteHtml = objectifActif ? "" : renderObjectifInviteSubtle();

    var dateLabelHtml = estAujourdhui
      ? esc(capitalize(formatDateLongue(new Date())))
      : '<span class="chip">jour choisi</span> ' + esc(capitalize(formatDateLongue(new Date(key+"T00:00:00"))));

    var html = '' +
      '<div class="home-header">' +
        '<div class="home-header-row">' +
          '<div>' +
            '<button class="home-date-btn" id="btn-date">'+dateLabelHtml+' ✎</button>' +
            (estAujourdhui ? '' : '<div class="home-date-today-link" id="btn-date-today">↺ Revenir à aujourd\'hui</div>') +
            '<div class="home-greet">'+(seg?seg.emoji:"👋")+' Faire le point</div>' +
          '</div>' +
          '<button class="icon-btn" id="btn-reglages" aria-label="Réglages">⚙️</button>' +
        '</div>' +
      '</div>' +
      soldeHtml +
      objectifActifHtml +
      recetteBtnHtml +
      '<div class="charges-section">' +
        '<div class="charges-title">Charges '+(estAujourdhui?"d\'aujourd\'hui":"de ce jour")+'</div>' +
        chargesHtml +
      '</div>' +
      objectifInviteHtml +
      '<div class="fab-wrap"><button class="fab" id="btn-add-charge">＋</button></div>' +
      renderTabBarHtml("aujourdhui");

    app.innerHTML = html;

    document.getElementById("btn-recette").addEventListener("click", function(){
      ui.modal = "recette";
      ui.modalData = { montant: recette !== null ? String(recette) : "" };
      renderModal();
    });
    document.getElementById("btn-add-charge").addEventListener("click", function(){
      ui.modal = "choix-rubrique";
      ui.modalData = {};
      renderModal();
    });
    app.querySelectorAll("[data-del-charge]").forEach(function(node){
      node.addEventListener("click", function(){
        ui.modal = "confirm-suppr-charge";
        ui.modalData = { chargeId: node.getAttribute("data-del-charge") };
        renderModal();
      });
    });
    var reglagesBtn = document.getElementById("btn-reglages");
    if(reglagesBtn) reglagesBtn.addEventListener("click", function(){
      ui.overlay = "reglages";
      render();
    });
    var btnDate = document.getElementById("btn-date");
    if(btnDate) btnDate.addEventListener("click", function(){
      ui.modal = "changer-date";
      ui.modalData = { date: key };
      renderModal();
    });
    var btnDateToday = document.getElementById("btn-date-today");
    if(btnDateToday) btnDateToday.addEventListener("click", function(){
      ui.accueilDate = null;
      render();
    });
    var objCardActif = document.getElementById("objectif-dashboard-card");
    if(objCardActif) objCardActif.addEventListener("click", function(){
      ui.tab = "objectif";
      render();
    });
    var objInvite = document.getElementById("objectif-invite-subtle");
    if(objInvite) objInvite.addEventListener("click", function(){
      ui.tab = "objectif";
      render();
    });
    attachTabBarEvents();
  }

  // Jauge de progression de l'objectif actif (F5), affichée en haut du tableau de bord —
  // information utile au quotidien une fois l'objectif créé.
  function renderObjectifDashboardCard(){
    var obj = state.objectif;
    var epargne = computeEpargneObjectif();
    var modele = MODELES_OBJECTIF.find(function(m){ return m.id === obj.modele; });
    if(!obj.montantCible){
      // Épargne libre (Sprint 5A) : pas de cible, donc pas de jauge en %.
      return '' +
        '<div class="objectif-card" id="objectif-dashboard-card">' +
          '<div class="objectif-card-head">' +
            '<span>'+(modele?modele.emoji+' ':'💰 ')+esc(obj.nom)+'</span>' +
          '</div>' +
          '<div class="objectif-card-sub">'+formatFCFA(epargne)+' mis de côté</div>' +
        '</div>';
    }
    var pct = Math.min(1, epargne / obj.montantCible);
    var pctAff = Math.round(pct * 100);
    return '' +
      '<div class="objectif-card" id="objectif-dashboard-card">' +
        '<div class="objectif-card-head">' +
          '<span>'+(modele?modele.emoji+' ':'🎯 ')+esc(obj.nom)+'</span>' +
          '<span>'+pctAff+'%</span>' +
        '</div>' +
        '<div class="gauge-track"><div class="gauge-fill" style="width:'+pctAff+'%"></div></div>' +
        '<div class="objectif-card-sub">'+formatFCFA(epargne)+' sur '+formatFCFA(obj.montantCible)+'</div>' +
      '</div>';
  }

  // Invite discrète à créer un objectif — pas de cadre plein ni de position en haut de l'accueil :
  // c'est un service optionnel (F7), il ne doit pas ressembler à une étape obligatoire du jour.
  // Reconnaît aussi discrètement la régularité (remarque terrain, validée) sans rien conditionner.
  function renderObjectifInviteSubtle(){
    var nbJours = Object.keys(state.jours).filter(function(k){ return jourADesDonnees(state.jours[k]); }).length;
    var noteJours = nbJours >= 5 ? '<span class="oi-jours">'+nbJours+' jours enregistrés</span>' : '<span></span>';
    return '' +
      '<div class="objectif-invite-subtle" id="objectif-invite-subtle">' +
        '<span>🎯 Définir un objectif (optionnel)</span>' +
        noteJours +
        '<span class="oi-arrow">›</span>' +
      '</div>';
  }

  /* ===================== MON ÉTAT (semaine / mois + historique) ===================== */

  function renderEtat(){
    var periode = ui.etatPeriode === "mois" ? "mois" : "semaine";
    var range = periode === "mois" ? getMonthRange(new Date()) : getWeekRange(new Date());
    var stats = computeEtatStats(range);
    var enPerte = stats.soldeCumule < 0;

    var periodLabel = periode === "mois"
      ? capitalize(MOIS_FR[new Date().getMonth()]) + " " + new Date().getFullYear()
      : "Du " + formatDateCourte(range.startDate) + " au " + formatDateCourte(range.endDate);

    var rubIds = Object.keys(stats.parRubrique).sort(function(a,b){
      return stats.parRubrique[b] - stats.parRubrique[a];
    });
    var rubriqueRows = rubIds.map(function(id){
      var r = state.config.rubriques.find(function(x){return x.id===id;});
      var nom = r ? r.nom : "Rubrique supprimée";
      var icone = r ? r.icone : "🏷️";
      var couleur = r ? r.couleur : "#7f8c9a";
      return '' +
        '<div class="charge-row">' +
          '<div class="rub-icon" style="background:'+couleur+'">'+icone+'</div>' +
          '<div class="charge-info"><div class="n">'+esc(nom)+'</div></div>' +
          '<div class="charge-amount">'+formatFCFA(stats.parRubrique[id])+'</div>' +
        '</div>';
    }).join("");

    var rubriqueSection = '' +
      '<div class="charges-section">' +
        '<div class="charges-title">Charges par rubrique</div>' +
        (rubriqueRows || '<div class="empty-state">Aucune charge enregistrée sur cette période.</div>') +
      '</div>';

    var joursKeys = stats.keys.filter(function(k){ return k !== todayKey(); }).slice().sort().reverse();
    var joursRows = joursKeys.map(function(k){
      var j = state.jours[k];
      var totalCh = j.charges.reduce(function(s,c){ return s + c.montant; }, 0);
      var solde = (j.recette||0) - totalCh;
      var d = new Date(k + "T00:00:00");
      return '' +
        '<div class="day-row" data-open-jour="'+k+'">' +
          '<div class="day-row-date">'+esc(JOURS_FR[d.getDay()]+" "+d.getDate()+" "+MOIS_FR[d.getMonth()])+(j.saisiApresCoup?' <span style="color:var(--text-faint); font-weight:500; text-transform:none;">· saisi plus tard</span>':'')+'</div>' +
          '<div class="day-row-solde '+(solde<0?"neg":"")+'">'+formatFCFA(solde)+'</div>' +
        '</div>';
    }).join("");

    var joursSection = '' +
      '<div class="charges-section">' +
        '<div class="charges-title">Jours enregistrés</div>' +
        (joursRows || '<div class="empty-state">Aucun jour archivé pour l\'instant.</div>') +
      '</div>';

    var html = '' +
      '<div class="home-header">' +
        '<div class="home-header-row">' +
          '<div class="home-greet">📊 Mon état</div>' +
          '<button class="icon-btn" id="btn-reglages" aria-label="Réglages">⚙️</button>' +
        '</div>' +
      '</div>' +
      '<div class="seg-toggle">' +
        '<button class="seg-btn '+(periode==="semaine"?"active":"")+'" data-periode="semaine">Semaine</button>' +
        '<button class="seg-btn '+(periode==="mois"?"active":"")+'" data-periode="mois">Mois</button>' +
      '</div>' +
      '<div class="etat-period-label">'+esc(periodLabel)+'</div>' +
      '<div class="solde-card '+(enPerte?"perte":"")+'" style="margin-top:14px;">' +
        '<p class="solde-label">Solde net cumulé</p>' +
        '<p class="solde-value '+(enPerte?"neg":"")+'">'+formatFCFA(stats.soldeCumule)+'</p>' +
        '<div class="solde-sub">' +
          '<div class="solde-sub-item"><div class="k">Recette totale</div><div class="v">'+formatFCFA(stats.recetteTotale)+'</div></div>' +
          '<div class="solde-sub-item"><div class="k">Charges totales</div><div class="v">'+formatFCFA(stats.chargesTotales)+'</div></div>' +
          '<div class="solde-sub-item"><div class="k">Moyenne / jour</div><div class="v">'+formatFCFA(stats.moyenne)+'</div></div>' +
        '</div>' +
      '</div>' +
      rubriqueSection +
      joursSection +
      renderTabBarHtml("etat");

    app.innerHTML = html;

    app.querySelectorAll("[data-periode]").forEach(function(node){
      node.addEventListener("click", function(){
        ui.etatPeriode = node.getAttribute("data-periode");
        renderEtat();
      });
    });
    app.querySelectorAll("[data-open-jour]").forEach(function(node){
      node.addEventListener("click", function(){
        ui.modal = "jour-detail";
        ui.modalData = { key: node.getAttribute("data-open-jour") };
        renderModal();
      });
    });
    var reglagesBtnEtat = document.getElementById("btn-reglages");
    if(reglagesBtnEtat) reglagesBtnEtat.addEventListener("click", function(){
      ui.overlay = "reglages";
      render();
    });
    attachTabBarEvents();
  }

  /* ===================== MON OBJECTIF (F7) ===================== */
  /* Création à partir de modèles pré-configurés, simulateur "3 façons
     d'y arriver" basé sur le solde net moyen réel des dernières semaines
     saisies, et suivi de l'objectif actif (un seul objectif à la fois,
     conservé dans state.objectif). */

  function renderObjectif(){
    var afficherFicheActive = state.objectif && state.objectif.actif && !ui.objEditing;
    var body = afficherFicheActive ? renderObjectifActif() : renderObjectifCreation();
    var html = '' +
      '<div class="home-header">' +
        '<div class="home-header-row">' +
          '<div class="home-greet">🎯 Mon objectif</div>' +
          '<button class="icon-btn" id="btn-reglages" aria-label="Réglages">⚙️</button>' +
        '</div>' +
      '</div>' +
      body +
      renderTabBarHtml("objectif");

    app.innerHTML = html;
    attachObjectifEvents();
    var reglagesBtnObj = document.getElementById("btn-reglages");
    if(reglagesBtnObj) reglagesBtnObj.addEventListener("click", function(){
      ui.overlay = "reglages";
      render();
    });
    attachTabBarEvents();
  }

  function renderObjectifActif(){
    var obj = state.objectif;
    var epargne = computeEpargneObjectif();
    var modele = MODELES_OBJECTIF.find(function(m){ return m.id === obj.modele; });
    var info = computeMoyenneHebdoRecente();
    var epargneHebdo = (obj.pourcentage && info.moyenne > 0) ? (info.moyenne * obj.pourcentage / 100) : 0;

    if(!obj.montantCible){
      // Épargne libre (Sprint 5A) : pas de cible, donc ni jauge en %, ni délai à afficher.
      return '' +
        '<div class="solde-card" style="margin:14px 20px 0;">' +
          '<p class="solde-label">'+(modele?modele.emoji+' ':'💰 ')+esc(obj.nom)+'</p>' +
          '<p class="solde-value" style="color:var(--text); font-size:30px;">'+formatFCFA(epargne)+
            ' <span style="font-size:15px; color:var(--text-dim); font-weight:600;">mis de côté</span></p>' +
          (obj.pourcentage
            ? '<p style="color:var(--text-dim); font-size:13px; margin-top:10px;">Rythme : '+obj.pourcentage+'% du solde net chaque semaine'+(epargneHebdo>0?' · environ '+formatFCFA(epargneHebdo)+' / semaine':'')+'</p>'
            : '') +
        '</div>' +
        '<div class="charges-section">' +
          '<div class="btn-row">' +
            '<button class="btn btn-ghost btn-sm" id="obj-changer-rythme">Changer de rythme</button>' +
            '<button class="btn btn-danger-ghost btn-sm" id="obj-supprimer">Supprimer</button>' +
          '</div>' +
        '</div>';
    }

    var pct = Math.min(1, epargne / obj.montantCible);
    var pctAff = Math.round(pct * 100);
    var restant = Math.max(0, obj.montantCible - epargne);
    var semainesRestantes = epargneHebdo > 0 ? Math.ceil(restant / epargneHebdo) : null;
    var atteint = epargne >= obj.montantCible;

    return '' +
      '<div class="solde-card" style="margin:14px 20px 0;">' +
        '<p class="solde-label">'+(modele?modele.emoji+' ':'🎯 ')+esc(obj.nom)+'</p>' +
        '<p class="solde-value" style="color:var(--text); font-size:30px;">'+formatFCFA(epargne)+
          ' <span style="font-size:15px; color:var(--text-dim); font-weight:600;">sur '+formatFCFA(obj.montantCible)+'</span></p>' +
        '<div class="gauge-track"><div class="gauge-fill" style="width:'+pctAff+'%"></div></div>' +
        (atteint
          ? '<div class="perte-banner" style="background:rgba(52,179,126,.16); color:var(--green); margin-top:10px;">🎉 Objectif atteint !</div>'
          : '' +
            '<p style="color:var(--text-dim); font-size:13px; margin-top:10px;">'+pctAff+'% atteint'+
              (obj.pourcentage ? ' · Rythme : '+obj.pourcentage+'% du solde net chaque semaine' : '')+'</p>' +
            (semainesRestantes !== null
              ? '<p style="color:var(--text-dim); font-size:13px; margin-top:2px;">Encore environ '+formatDureeSemaines(semainesRestantes)+' à ce rythme</p>'
              : '<p style="color:var(--text-dim); font-size:13px; margin-top:2px;">Saisissez quelques jours de plus pour affiner l\'estimation.</p>')
        ) +
      '</div>' +
      '<div class="charges-section">' +
        '<div class="btn-row">' +
          '<button class="btn btn-ghost btn-sm" id="obj-changer-rythme">Changer de rythme</button>' +
          '<button class="btn btn-danger-ghost btn-sm" id="obj-supprimer">Supprimer</button>' +
        '</div>' +
      '</div>';
  }

  function renderObjectifCreation(){
    var step = ui.objStep || 1;
    var body;
    if(step === 1) body = objStep1();
    else if(step === 2) body = objStep2();
    else body = objStep3();
    return '<div style="padding:0 20px;">' + body + '</div>';
  }

  function objStep1(){
    var cards = MODELES_OBJECTIF.map(function(m){
      var sel = ui.objData.modele === m.id ? "selected" : "";
      return '' +
        '<div class="choice-card '+sel+'" data-modele="'+m.id+'" style="padding:18px 10px;">' +
          '<span class="emoji">'+m.emoji+'</span><span>'+esc(m.nom)+'</span>' +
          '<span style="font-size:11px; color:var(--text-dim); font-weight:400;">'+esc(m.desc)+'</span>' +
        '</div>';
    }).join("");

    var sousTypesHtml = "";
    if(ui.objData.modele){
      var modele = MODELES_OBJECTIF.find(function(m){ return m.id === ui.objData.modele; });
      if(modele && modele.sousTypes && modele.sousTypes.length > 0){
        sousTypesHtml = '' +
          '<p class="field-label">Précisez (optionnel)</p>' +
          '<div class="emoji-grid">' +
          modele.sousTypes.map(function(st){
            var sel = ui.objData.sousType === st ? "selected" : "";
            return '<div class="choice-card '+sel+'" data-soustype="'+esc(st)+'" style="flex-direction:row; padding:10px 14px; font-size:13px;">'+esc(st)+'</div>';
          }).join("") + '</div>';
      }
    }

    return '' +
      '<p class="onb-eyebrow" style="margin-top:16px;">Nouvel objectif</p>' +
      '<h1 class="onb-title" style="font-size:20px;">Vous mettez de côté pour quoi ?</h1>' +
      '<p class="onb-sub">Choisissez ce qui vous ressemble le plus.</p>' +
      '<div class="onb-grid" style="grid-template-columns:repeat(2,1fr);">'+cards+'</div>' +
      sousTypesHtml +
      '<div style="height:10px;"></div>' +
      '<button class="btn btn-primary" id="obj1-next" '+(ui.objData.modele?"":"disabled")+'>Continuer</button>';
  }

  function objStep2(){
    var modele = MODELES_OBJECTIF.find(function(m){ return m.id === ui.objData.modele; });
    var sansCible = ui.objData.modele === "epargne_libre";
    if(!ui.objData.nom){
      ui.objData.nom = (modele ? modele.nom : "Mon objectif") + (ui.objData.sousType ? " — "+ui.objData.sousType : "");
    }
    var peutContinuer = sansCible || !!ui.objData.montantCible;
    return '' +
      '<p class="onb-eyebrow" style="margin-top:16px;">Nouvel objectif</p>' +
      '<h1 class="onb-title" style="font-size:20px;">Encore deux ou trois choses</h1>' +
      '<p class="field-label">Comment on l\'appelle ?</p>' +
      '<input type="text" class="text-input" id="obj-nom" value="'+esc(ui.objData.nom||"")+'" maxlength="40">' +
      '<p class="field-label" style="margin-top:14px;">Montant visé'+(sansCible?" (optionnel)":"")+'</p>' +
      '<div class="amount-input-wrap">' +
        '<input type="text" inputmode="numeric" id="obj-montant" placeholder="0" value="'+esc(spacedDigits(ui.objData.montantCible))+'">' +
        '<span class="suffix">F</span>' +
      '</div>' +
      (sansCible ? '<p class="field-help">Laissez à 0 si vous voulez juste mettre de côté, sans montant précis en tête.</p>' : '') +
      '<div style="height:10px;"></div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-ghost" id="obj2-back">Retour</button>' +
        '<button class="btn btn-primary" id="obj2-next" '+(peutContinuer?"":"disabled")+'>Voir mes options</button>' +
      '</div>';
  }

  function objStep3(){
    var sansCible = ui.objData.modele === "epargne_libre" && !ui.objData.montantCible;
    var montantCible = ui.objData.montantCible || 0;
    var scenarios = computeScenarios(montantCible);
    var info = computeMoyenneHebdoRecente();

    var note = info.nbSemaines === 0
      ? '<div class="warn-msg">Pas encore assez d\'infos. Dès que vous aurez enregistré quelques jours, on pourra vous proposer des chiffres.</div>'
      : '<p class="field-help">D\'après ce que vous gagnez ces derniers temps (vos '+info.nbSemaines+' dernière'+(info.nbSemaines>1?"s":"")+' semaine'+(info.nbSemaines>1?"s":"")+') : à peu près '+formatFCFA(info.moyenne)+' par semaine.</p>';

    var cards = scenarios.map(function(s){
      var sel = ui.objData.pourcentageChoisi === s.pourcentage ? "selected" : "";
      return '' +
        '<div class="choice-card scenario-card '+sel+'" data-scenario="'+s.pourcentage+'">' +
          '<div>' +
            '<div class="sc-name">'+(NOMS_SCENARIO[s.pourcentage]||"")+' · '+s.pourcentage+'%</div>' +
            '<div class="sc-sub">'+(s.epargneHebdo>0 ? formatFCFA(s.epargneHebdo)+" / semaine" : "à déterminer")+'</div>' +
          '</div>' +
          '<div class="sc-duree">'+(sansCible ? "Libre" : formatDureeSemaines(s.semaines))+'</div>' +
        '</div>';
    }).join("");

    return '' +
      '<p class="onb-eyebrow" style="margin-top:16px;">Comment y arriver</p>' +
      '<h1 class="onb-title" style="font-size:20px;">À quel rythme ?</h1>' +
      note +
      '<div class="choice-row" style="margin-top:14px;">'+cards+'</div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-ghost" id="obj3-back">Retour</button>' +
        '<button class="btn btn-primary" id="obj3-finish" '+(ui.objData.pourcentageChoisi?"":"disabled")+'>Valider mon objectif</button>' +
      '</div>';
  }

  function attachObjectifEvents(){
    if(state.objectif && state.objectif.actif && !ui.objEditing){
      var chRythme = document.getElementById("obj-changer-rythme");
      if(chRythme) chRythme.addEventListener("click", function(){
        ui.objData = {
          modele: state.objectif.modele,
          sousType: state.objectif.sousType,
          nom: state.objectif.nom,
          montantCible: state.objectif.montantCible,
          pourcentageChoisi: null
        };
        ui.objEditing = true;
        ui.objStep = 3;
        renderObjectif();
      });
      var suppr = document.getElementById("obj-supprimer");
      if(suppr) suppr.addEventListener("click", function(){
        ui.modal = "confirm-suppr-objectif";
        ui.modalData = {};
        renderModal();
      });
      return;
    }

    var step = ui.objStep || 1;

    if(step === 1){
      app.querySelectorAll("[data-modele]").forEach(function(node){
        node.addEventListener("click", function(){
          ui.objData.modele = node.getAttribute("data-modele");
          ui.objData.sousType = null;
          renderObjectif();
        });
      });
      app.querySelectorAll("[data-soustype]").forEach(function(node){
        node.addEventListener("click", function(){
          ui.objData.sousType = node.getAttribute("data-soustype");
          renderObjectif();
        });
      });
      var next1 = document.getElementById("obj1-next");
      if(next1) next1.addEventListener("click", function(){ ui.objStep = 2; renderObjectif(); });
    }

    if(step === 2){
      var nomInput = document.getElementById("obj-nom");
      if(nomInput) nomInput.addEventListener("input", function(){ ui.objData.nom = nomInput.value; });
      var montantInput = document.getElementById("obj-montant");
      var next2 = document.getElementById("obj2-next");
      attachAmountInput(montantInput, function(value){
        ui.objData.montantCible = value;
        if(next2) next2.disabled = !value && ui.objData.modele !== "epargne_libre";
      });
      var back2 = document.getElementById("obj2-back");
      if(back2) back2.addEventListener("click", function(){ ui.objStep = 1; renderObjectif(); });
      if(next2) next2.addEventListener("click", function(){
        if(nomInput) ui.objData.nom = nomInput.value.trim() || ui.objData.nom;
        ui.objStep = 3;
        renderObjectif();
      });
    }

    if(step === 3){
      app.querySelectorAll("[data-scenario]").forEach(function(node){
        node.addEventListener("click", function(){
          ui.objData.pourcentageChoisi = parseInt(node.getAttribute("data-scenario"), 10);
          renderObjectif();
        });
      });
      var back3 = document.getElementById("obj3-back");
      if(back3) back3.addEventListener("click", function(){
        if(ui.objEditing){
          // "Changer de rythme" ne repasse pas par le choix du modèle : Retour annule et revient à la fiche.
          ui.objEditing = false;
          ui.objStep = 1;
          ui.objData = {};
          renderObjectif();
        } else {
          ui.objStep = 2;
          renderObjectif();
        }
      });
      var finish3 = document.getElementById("obj3-finish");
      if(finish3) finish3.addEventListener("click", function(){
        var enCours = state.objectif; // conserve id + date de création si on change juste de rythme
        state.objectif = {
          id: enCours ? enCours.id : uid("obj"),
          modele: ui.objData.modele,
          sousType: ui.objData.sousType || null,
          nom: (ui.objData.nom||"").trim() || "Mon objectif",
          montantCible: ui.objData.montantCible || 0,
          dateCreation: enCours ? enCours.dateCreation : todayKey(),
          pourcentage: ui.objData.pourcentageChoisi,
          actif: true
        };
        saveState();
        ui.objStep = 1;
        ui.objData = {};
        ui.objEditing = false;
        renderObjectif();
        showToast("Objectif enregistré.");
      });
    }
  }

  /* ===================== MODALES ===================== */

  function renderModal(){
    var existing = document.querySelector(".modal-overlay");
    if(existing) existing.remove();

    if(!ui.modal || ui.modal === "perso-inline") return; // perso-inline s'affiche inline dans l'onboarding

    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";

    var sheetHtml = "";
    if(ui.modal === "recette") sheetHtml = modalRecette();
    else if(ui.modal === "choix-rubrique") sheetHtml = modalChoixRubrique();
    else if(ui.modal === "montant-charge") sheetHtml = modalMontantCharge();
    else if(ui.modal === "perso-modal") sheetHtml = '<div class="modal-handle"></div>' + renderPersoForm("modal");
    else if(ui.modal === "confirm-suppr-charge") sheetHtml = modalConfirmSupprCharge();
    else if(ui.modal === "changer-date") sheetHtml = modalChangerDate();
    else if(ui.modal === "jour-detail") sheetHtml = modalJourDetail();
    else if(ui.modal === "confirm-suppr-objectif") sheetHtml = modalConfirmSupprObjectif();
    else if(ui.modal === "confirm-restaurer") sheetHtml = modalConfirmRestaurer();
    else if(ui.modal === "perso-modal-reglages") sheetHtml = '<div class="modal-handle"></div>' + renderPersoForm("modal");
    else if(ui.modal === "confirm-suppr-rubrique") sheetHtml = modalConfirmSupprRubrique();
    else if(ui.modal === "pin-verify") sheetHtml = modalPinVerify();
    else if(ui.modal === "pin-set") sheetHtml = modalPinSet();
    else if(ui.modal === "pin-oublie") sheetHtml = modalPinOublie();
    else if(ui.modal === "confirm-effacer-tout") sheetHtml = modalConfirmEffacerTout();

    overlay.innerHTML = '<div class="modal-sheet">' + sheetHtml + '</div>';
    document.body.appendChild(overlay);

    overlay.addEventListener("click", function(e){
      if(e.target === overlay) closeModal();
    });

    if(ui.modal === "recette") attachModalRecetteEvents();
    else if(ui.modal === "choix-rubrique") attachModalChoixRubriqueEvents();
    else if(ui.modal === "montant-charge") attachModalMontantChargeEvents();
    else if(ui.modal === "perso-modal") attachPersoFormEvents(function(){ renderModal(); }, true);
    else if(ui.modal === "confirm-suppr-charge") attachModalConfirmSupprChargeEvents();
    else if(ui.modal === "changer-date") attachModalChangerDateEvents();
    else if(ui.modal === "jour-detail") attachModalJourDetailEvents();
    else if(ui.modal === "confirm-suppr-objectif") attachModalConfirmSupprObjectifEvents();
    else if(ui.modal === "confirm-restaurer") attachModalConfirmRestaurerEvents();
    else if(ui.modal === "perso-modal-reglages") attachPersoFormEvents(function(){ renderModal(); renderReglagesScreen(); }, false);
    else if(ui.modal === "confirm-suppr-rubrique") attachModalConfirmSupprRubriqueEvents();
    else if(ui.modal === "pin-verify") attachModalPinVerifyEvents();
    else if(ui.modal === "pin-set") attachModalPinSetEvents();
    else if(ui.modal === "pin-oublie") attachModalPinOublieEvents();
    else if(ui.modal === "confirm-effacer-tout") attachModalConfirmEffacerToutEvents();
  }

  function closeModal(){
    ui.modal = null;
    ui.modalData = {};
    renderModal();
  }

  function modalRecette(){
    return '' +
      '<div class="modal-handle"></div>' +
      '<h2 class="modal-title">Recette du jour</h2>' +
      '<p class="modal-sub">Le montant total encaissé '+entryDateLabel()+'.</p>' +
      '<div class="amount-input-wrap">' +
        '<input type="text" inputmode="numeric" id="modal-recette-input" placeholder="0" value="'+esc(spacedDigits(ui.modalData.montant))+'" autofocus>' +
        '<span class="suffix">F</span>' +
      '</div>' +
      '<div style="height:18px"></div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-ghost" id="modal-recette-cancel">Annuler</button>' +
        '<button class="btn btn-primary" id="modal-recette-save">Valider</button>' +
      '</div>';
  }

  function attachModalRecetteEvents(){
    var input = document.getElementById("modal-recette-input");
    if(input) input.focus();
    attachAmountInput(input, function(value, formatted){ ui.modalData.montant = formatted; });
    document.getElementById("modal-recette-cancel").addEventListener("click", closeModal);
    document.getElementById("modal-recette-save").addEventListener("click", function(){
      var montant = parseAmountInput(input ? input.value : ui.modalData.montant);
      var jour = ensureJour(currentEntryKey());
      jour.recette = montant;
      saveState();
      closeModal();
      renderAccueil();
    });

  /* ---------- Réglages : sauvegarde et restauration (F9) ---------- */
  /* La modale "Mes données" du Sprint 3 est remplacée au Sprint 4 par un
     écran Réglages complet (voir renderReglagesScreen plus bas), qui
     regroupe segment, rubriques, dioulatchai, PIN et sauvegarde/restauration
     au même endroit (F10). La lecture de fichier reste ici, partagée entre
     l'écran Réglages et le parcours "Code PIN oublié" du verrouillage. */

  function lireEtProposerRestauration(file){
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{
        parsed = JSON.parse(reader.result);
      }catch(e){
        showToast("Fichier illisible.");
        return;
      }
      if(!parsed || typeof parsed !== "object" || !parsed.config || !parsed.jours){
        showToast("Ce fichier ne ressemble pas à une sauvegarde Trépor.");
        return;
      }
      ui.modal = "confirm-restaurer";
      ui.modalData = { fichier: parsed };
      renderModal();
    };
    reader.onerror = function(){ showToast("Impossible de lire ce fichier."); };
    reader.readAsText(file);
  }

    return '' +

        '<div class="btn-row" style="margin-top:10px;">' +
          '<button class="btn btn-ghost" id="confirm-restaurer-non">Annuler</button>' +

  function exporterSauvegarde(){
    try{
      var data = JSON.stringify(state, null, 2);
      var blob = new Blob([data], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "trepor_sauvegarde_" + todayKey() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);

      state.meta = state.meta || {};
      state.meta.derniereSauvegarde = todayKey();
      state.meta.dernierRappelSauvegarde = todayKey();
      saveState();
      closeModal();
      render();
      showToast("Sauvegarde téléchargée.");
    }catch(e){
      showToast("Impossible de générer la sauvegarde sur cet appareil.");
    }
  }

  // Rappel doux (F9) : une fois par semaine au plus, si la dernière
  // sauvegarde date de 7 jours ou plus (ou n'a jamais été faite).
  function verifierRappelSauvegarde(){
    if(!state.config.onboardingComplete) return;
    state.meta = state.meta || { derniereSauvegarde:null, dernierRappelSauvegarde:null };
    var today = todayKey();
    var joursDepuisSauvegarde = state.meta.derniereSauvegarde ? joursEntre(state.meta.derniereSauvegarde, today) : Infinity;
    var joursDepuisRappel = state.meta.dernierRappelSauvegarde ? joursEntre(state.meta.dernierRappelSauvegarde, today) : Infinity;
    if(joursDepuisSauvegarde >= RAPPEL_SAUVEGARDE_JOURS && joursDepuisRappel >= RAPPEL_SAUVEGARDE_JOURS){
      state.meta.dernierRappelSauvegarde = today;
      saveState();
      setTimeout(function(){ showToast("Pensez à sauvegarder vos données 💾"); }, 700);
    }
  }

  function attachReglagesEvents(){
    var back = document.getElementById("reg-back");
    if(back) back.addEventListener("click", function(){ ui.overlay = null; render(); });

    app.querySelectorAll("[data-reg-segment]").forEach(function(node){
      node.addEventListener("click", function(){
        state.config.segment = node.getAttribute("data-reg-segment");
        saveState();
        renderReglagesScreen();
        showToast("Segment mis à jour.");
      });
    });

    app.querySelectorAll("[data-reg-statut]").forEach(function(node){
      node.addEventListener("click", function(){
        state.config.statutVehicule = node.getAttribute("data-reg-statut");
        var dioul = state.config.rubriques.find(function(r){ return r.id === "dioulatchai"; });
        if(dioul) dioul.actif = state.config.statutVehicule === "locataire";
        saveState();
        renderReglagesScreen();
      });
    });
    var dInput = document.getElementById("reg-dioulatchai-input");
    attachAmountInput(dInput, function(value){
      state.config.dioulatchai = value;
      saveState();
    });

    app.querySelectorAll("[data-reg-toggle-rub]").forEach(function(node){
      node.addEventListener("click", function(){
        var id = node.getAttribute("data-reg-toggle-rub");
        var r = state.config.rubriques.find(function(x){ return x.id === id; });
        if(r){ r.actif = !r.actif; saveState(); renderReglagesScreen(); }
      });
    });
    app.querySelectorAll("[data-reg-del-rub]").forEach(function(node){
      node.addEventListener("click", function(e){
        e.stopPropagation();
        ui.modal = "confirm-suppr-rubrique";
        ui.modalData = { rubriqueId: node.getAttribute("data-reg-del-rub") };
        renderModal();
      });
    });

    var addPerso = document.getElementById("reg-add-perso");
    if(addPerso) addPerso.addEventListener("click", function(){
      ui.modal = "perso-modal-reglages";
      ui.modalData = { nom:"", icone:"", emojiCustom:"", couleur:COLOR_CHOICES[0] };
      renderModal();
    });

    var pinSwitch = document.getElementById("reg-pin-switch");
    if(pinSwitch) pinSwitch.addEventListener("click", function(){
      if(state.config.pinActif){
        ui.modal = "pin-verify";
        ui.modalData = { mode:"disable", pin:"" };
      } else {
        ui.modal = "pin-set";
        ui.modalData = { mode:"activate", step:1, firstPin:"", pin:"" };
      }
      renderModal();
    });
    var pinModifier = document.getElementById("reg-pin-modifier");
    if(pinModifier) pinModifier.addEventListener("click", function(){
      ui.modal = "pin-verify";
      ui.modalData = { mode:"change", pin:"" };
      renderModal();
    });

    var save = document.getElementById("reg-sauvegarder");
    if(save) save.addEventListener("click", exporterSauvegarde);
    var restoreBtn = document.getElementById("reg-restaurer");
    var fileInput = document.getElementById("reg-input-restaurer");
    if(restoreBtn && fileInput){
      restoreBtn.addEventListener("click", function(){ fileInput.click(); });
      fileInput.addEventListener("change", function(){
        var file = fileInput.files && fileInput.files[0];
        fileInput.value = "";
        if(!file) return;
        lireEtProposerRestauration(file);

  /* Verrouillage optionnel à l'ouverture. Le code (4 chiffres) est stocké
     localement (state.config.pinCode) -- il ne protège pas contre quelqu'un
     qui aurait accès aux fichiers du téléphone, seulement contre un regard

  function renderPinDots(pin){
    pin = pin || "";
    var dots = [0,1,2,3].map(function(i){
      return '<div class="pin-dot '+(pin.length > i ? "filled" : "")+'"></div>';
    }).join("");
    return '<div class="pin-dots">'+dots+'</div>';
  }

  function renderPinKeypad(){
    var keys = ["1","2","3","4","5","6","7","8","9","","0","back"];
    return '<div class="pin-keypad">' + keys.map(function(k){
      if(k === "") return '<div class="pin-key empty"></div>';
      if(k === "back") return '<button class="pin-key" data-pin-action="back" aria-label="Effacer">⌫</button>';
      return '<button class="pin-key" data-pin-digit="'+k+'">'+k+'</button>';
    }).join("") + '</div>';
  }

  // currentPin : valeur actuelle du code en cours de saisie.
  // onUpdate(nouveauPin) : appelé après chaque frappe (chiffre ou effacement).
  function attachPinKeypadEvents(currentPin, onUpdate){
    currentPin = currentPin || "";
    document.querySelectorAll("[data-pin-digit]").forEach(function(node){
      node.addEventListener("click", function(){
        if(currentPin.length >= 4) return;
        onUpdate(currentPin + node.getAttribute("data-pin-digit"));
      });
    });
    var back = document.querySelector('[data-pin-action="back"]');
    if(back) back.addEventListener("click", function(){
      onUpdate(currentPin.slice(0, -1));
    });
  }
