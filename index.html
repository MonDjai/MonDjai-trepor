<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MonDjai/Trépor</title>
<meta name="description" content="Le point du jour, en 30 secondes. Suivi de recette et charges pour chauffeurs.">
<meta name="theme-color" content="#11141a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trépor">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  :root{
    --bg:#11141a;
    --bg-2:#0c0e13;
    --card:#1a1e27;
    --card-2:#20242f;
    --border:#2a2f3b;
    --text:#f2f3f5;
    --text-dim:#9aa0ac;
    --text-faint:#666c78;
    --accent:#f5a623;
    --accent-dark:#d68a0f;
    --accent-text:#11141a;
    --green:#34b37e;
    --red:#ff6b5e;
    --radius:16px;
    --radius-sm:10px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-2);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    padding-bottom:calc(120px + var(--safe-bottom));
  }
  button{font-family:inherit;}
  input{font-family:inherit;}

  /* ---------- Écrans d'onboarding ---------- */
  .onb{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:calc(28px + var(--safe-top)) 22px 24px;
  }
  .onb-steps{
    display:flex;
    gap:6px;
    margin-bottom:22px;
  }
  .onb-step-dot{
    flex:1;
    height:4px;
    border-radius:2px;
    background:var(--border);
  }
  .onb-step-dot.done{background:var(--accent);}
  .onb-eyebrow{
    color:var(--accent);
    font-size:13px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    margin:0 0 6px;
  }
  .onb-title{
    font-size:24px;
    font-weight:800;
    margin:0 0 8px;
    line-height:1.25;
  }
  .onb-sub{
    color:var(--text-dim);
    font-size:15px;
    line-height:1.5;
    margin:0 0 24px;
  }
  .onb-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
  }
  .choice-card{
    background:var(--card);
    border:2px solid var(--border);
    border-radius:var(--radius);
    padding:20px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
    color:var(--text);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .choice-card .emoji{font-size:34px;}
  .choice-card.selected{
    border-color:var(--accent);
    background:linear-gradient(180deg, rgba(245,166,35,.16), rgba(245,166,35,.06));
  }
  .choice-row{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:18px;
  }
  .choice-row .choice-card{
    flex-direction:row;
    justify-content:flex-start;
    text-align:left;
    padding:18px 16px;
  }
  .choice-row .choice-card .emoji{font-size:26px;}

  .field-label{
    font-size:14px;
    font-weight:700;
    color:var(--text);
    margin:4px 0 8px;
  }
  .field-help{
    font-size:13px;
    color:var(--text-dim);
    margin:8px 0 0;
    line-height:1.5;
  }
  .amount-input-wrap{
    display:flex;
    align-items:center;
    background:var(--card);
    border:2px solid var(--border);
    border-radius:var(--radius);
    padding:4px 16px;
  }
  .amount-input-wrap:focus-within{border-color:var(--accent);}
  .amount-input-wrap input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:28px;
    font-weight:800;
    padding:14px 4px;
    min-width:0;
    -moz-appearance:textfield;
  }
  .amount-input-wrap input::-webkit-outer-spin-button,
  .amount-input-wrap input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .amount-input-wrap .suffix{
    color:var(--text-dim);
    font-size:18px;
    font-weight:700;
  }

  .onb-spacer{flex:1;}

  .btn{
    display:block;
    width:100%;
    border:none;
    border-radius:var(--radius);
    padding:16px 18px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    text-align:center;
  }
  .btn-primary{
    background:var(--accent);
    color:var(--accent-text);
  }
  .btn-primary:disabled{
    background:var(--border);
    color:var(--text-faint);
    cursor:not-allowed;
  }
  .btn-ghost{
    background:transparent;
    color:var(--text-dim);
    border:2px solid var(--border);
  }
  .btn-danger-ghost{
    background:transparent;
    color:var(--red);
    border:2px solid var(--border);
  }
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}
  .btn-sm{padding:10px 14px; font-size:14px; border-radius:var(--radius-sm);}

  /* ---------- Rubriques (sélection) ---------- */
  .rub-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
  }
  .rub-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:2px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    cursor:pointer;
  }
  .rub-row.on{border-color:var(--rub-color, var(--accent));}
  .rub-icon{
    width:40px;height:40px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    background:var(--rub-color, var(--accent));
    flex-shrink:0;
  }
  .rub-name{flex:1; font-size:15px; font-weight:600;}
  .rub-name .rub-note{display:block; font-size:12px; color:var(--text-dim); font-weight:400; margin-top:1px;}
  .switch{
    width:44px;height:26px;
    border-radius:14px;
    background:var(--border);
    position:relative;
    flex-shrink:0;
  }
  .switch.on{background:var(--accent);}
  .switch::after{
    content:"";
    position:absolute;
    top:3px; left:3px;
    width:20px;height:20px;
    border-radius:50%;
    background:#fff;
    transition:left .15s ease;
  }
  .switch.on::after{left:21px;}

  .add-rub-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:2px dashed var(--border);
    border-radius:var(--radius-sm);
    padding:14px;
    color:var(--text-dim);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    margin-bottom:10px;
  }
  .warn-msg{
    background:rgba(245,166,35,.12);
    border:1px solid rgba(245,166,35,.35);
    color:var(--accent);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    font-size:13px;
    font-weight:600;
    margin-bottom:14px;
  }

  .perso-form{
    background:var(--card-2);
    border:2px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .text-input{
    width:100%;
    background:var(--card);
    border:2px solid var(--border);
    border-radius:var(--radius-sm);
    color:var(--text);
    font-size:15px;
    padding:12px 14px;
    outline:none;
  }
  .text-input:focus{border-color:var(--accent);}
  .emoji-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .emoji-opt{
    width:42px;height:42px;
    border-radius:10px;
    background:var(--card);
    border:2px solid var(--border);
    font-size:20px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .emoji-opt.selected{border-color:var(--accent);}
  .color-grid{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .color-opt{
    width:32px;height:32px;
    border-radius:50%;
    border:3px solid transparent;
    cursor:pointer;
  }
  .color-opt.selected{border-color:#fff;}
  .color-custom-wrap{display:flex; align-items:center; gap:8px;}
  .color-custom-wrap input[type=color]{
    width:36px;height:36px;
    border:none;
    border-radius:50%;
    overflow:hidden;
    background:none;
    padding:0;
    cursor:pointer;
  }

  /* ---------- Accueil ---------- */
  .home-header{
    padding:calc(20px + var(--safe-top)) 20px 6px;
  }
  .home-date{
    color:var(--text-dim);
    font-size:14px;
    font-weight:600;
    text-transform:capitalize;
  }
  .home-date-btn{
    background:none;
    border:none;
    padding:0;
    margin:0;
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--text-dim);
    font-size:14px;
    font-weight:600;
    text-transform:capitalize;
    cursor:pointer;
    text-align:left;
  }
  .home-date-btn .chip{
    background:var(--card-2);
    border:1px solid var(--border);
    border-radius:999px;
    padding:2px 9px;
    font-size:11px;
    font-weight:700;
    color:var(--accent);
    text-transform:none;
    flex-shrink:0;
  }
  .home-date-today-link{
    display:inline-block;
    margin:4px 0 0;
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    cursor:pointer;
    text-transform:none;
  }
  .date-input-native{
    width:100%;
    background:var(--card);
    border:2px solid var(--border);
    border-radius:var(--radius-sm);
    color:var(--text);
    font-size:16px;
    padding:14px;
    outline:none;
    color-scheme:dark;
  }
  .date-input-native:focus{border-color:var(--accent);}
  .home-greet{
    font-size:22px;
    font-weight:800;
    margin:2px 0 0;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .solde-card{
    margin:14px 20px 0;
    background:linear-gradient(160deg, var(--card), var(--card-2));
    border:1px solid var(--border);
    border-radius:20px;
    padding:24px 20px;
    text-align:center;
  }
  .solde-card.perte{
    background:linear-gradient(160deg, rgba(255,107,94,.16), var(--card));
    border-color:rgba(255,107,94,.4);
  }
  .solde-label{
    font-size:13px;
    font-weight:700;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .solde-value{
    font-size:40px;
    font-weight:900;
    margin:6px 0 0;
    line-height:1.15;
    color:var(--green);
  }
  .solde-value.neg{color:var(--red);}
  .perte-banner{
    margin-top:10px;
    display:inline-block;
    background:rgba(255,107,94,.16);
    color:var(--red);
    font-weight:800;
    font-size:14px;
    border-radius:999px;
    padding:6px 14px;
  }
  .solde-sub{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--border);
  }
  .solde-sub-item{text-align:center;}
  .solde-sub-item .k{font-size:12px; color:var(--text-dim); font-weight:600;}
  .solde-sub-item .v{font-size:17px; font-weight:800; margin-top:2px;}

  .recette-btn{
    margin:16px 20px 0;
    background:var(--card);
    border:2px solid var(--accent);
    color:var(--text);
    border-radius:var(--radius);
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    text-align:left;
  }
  .recette-btn .ic{font-size:26px;}
  .recette-btn .lbl{flex:1;}
  .recette-btn .lbl .t1{font-weight:800; font-size:15px;}
  .recette-btn .lbl .t2{color:var(--text-dim); font-size:13px; margin-top:2px;}
  .recette-btn.set{border-color:var(--green);}

  .charges-section{
    margin:22px 20px 0;
  }
  .charges-title{
    font-size:15px;
    font-weight:800;
    margin-bottom:10px;
  }
  .charge-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px 12px;
    margin-bottom:8px;
  }
  .charge-row .rub-icon{width:38px;height:38px;font-size:18px;}
  .charge-info{flex:1; min-width:0;}
  .charge-info .n{font-size:14px; font-weight:700;}
  .charge-amount{font-size:15px; font-weight:800; color:var(--text);}
  .charge-del{
    width:30px;height:30px;
    border-radius:50%;
    background:var(--card-2);
    border:none;
    color:var(--text-dim);
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .empty-state{
    text-align:center;
    color:var(--text-faint);
    font-size:14px;
    padding:22px 10px;
    border:1px dashed var(--border);
    border-radius:var(--radius-sm);
  }

  .fab{
    position:fixed;
    right:20px;
    bottom:calc(94px + var(--safe-bottom));
    width:60px;height:60px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-text);
    font-size:30px;
    font-weight:700;
    border:none;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    z-index:40;
  }
  .fab-wrap{
    max-width:520px;
    margin:0 auto;
    position:relative;
  }

  /* ---------- Barre de navigation (onglets) ---------- */
  .tabbar-wrap{
    position:fixed;
    left:0;right:0;
    bottom:0;
    z-index:50;
    pointer-events:none;
  }
  .tabbar{
    max-width:520px;
    margin:0 auto;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--border);
    padding:8px 10px calc(8px + var(--safe-bottom));
    pointer-events:auto;
  }
  .tabbar-btn{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text-dim);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    font-size:10.5px;
    font-weight:700;
    padding:6px 2px;
    cursor:pointer;
    border-radius:12px;
  }
  .tabbar-btn .tabbar-ic{font-size:19px;}
  .tabbar-btn.active{color:var(--accent);}

  /* ---------- En-tête avec accès réglages ---------- */
  .home-header-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .icon-btn{
    width:40px;height:40px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }

  /* ---------- Objectif : jauge de progression ---------- */
  .gauge-track{
    width:100%;
    height:12px;
    border-radius:999px;
    background:var(--card-2);
    overflow:hidden;
    margin-top:12px;
  }
  .gauge-fill{
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--accent-dark), var(--accent));
    transition:width .25s ease;
  }
  .objectif-card{
    margin:14px 20px 0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    cursor:pointer;
  }
  .objectif-card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:14px;
    font-weight:800;
  }
  .objectif-card-head span:last-child{color:var(--accent);}
  .objectif-card-sub{
    margin-top:8px;
    font-size:13px;
    color:var(--text-dim);
    font-weight:600;
  }
  .objectif-prompt{
    margin:14px 20px 0;
    border:2px dashed var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    color:var(--text-dim);
    font-weight:700;
    font-size:14px;
    text-align:center;
    cursor:pointer;
  }
  .objectif-invite-subtle{
    margin:18px 20px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:2px 2px;
    color:var(--text-faint);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .objectif-invite-subtle .oi-jours{
    color:var(--text-faint);
    font-weight:600;
  }
  .objectif-invite-subtle .oi-arrow{
    color:var(--text-dim);
    font-weight:800;
  }
  .disponible-line{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--border);
    font-size:13px;
    font-weight:600;
    color:var(--text-dim);
    text-align:center;
  }
  .disponible-line b{ color:var(--text); font-weight:800; }
  .scenario-card{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    text-align:left;
    padding:16px;
    gap:10px;
    width:100%;
  }
  .scenario-card .sc-name{font-weight:800; font-size:15px;}
  .scenario-card .sc-sub{font-size:12px; color:var(--text-dim); font-weight:400; margin-top:2px;}
  .scenario-card .sc-duree{font-weight:800; color:var(--accent); white-space:nowrap; text-align:right; margin-left:auto; padding-left:10px;}

  /* ---------- Mon état ---------- */
  .seg-toggle{
    margin:16px 20px 0;
    display:flex;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:4px;
    gap:4px;
  }
  .seg-btn{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-weight:700;
    font-size:14px;
    padding:10px 0;
    border-radius:9px;
    cursor:pointer;
  }
  .seg-btn.active{background:var(--accent); color:var(--accent-text);}
  .etat-period-label{
    margin:10px 20px 0;
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    text-align:center;
    text-transform:capitalize;
  }
  .day-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:14px 14px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .day-row-date{font-size:14px; font-weight:700; text-transform:capitalize;}
  .day-row-solde{font-size:15px; font-weight:800; color:var(--green);}
  .day-row-solde.neg{color:var(--red);}

  /* ---------- Modales ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(5,6,9,.62);
    display:flex;
    align-items:flex-end;
    z-index:100;
  }
  .modal-sheet{
    width:100%;
    max-width:520px;
    margin:0 auto;
    background:var(--bg);
    border-radius:22px 22px 0 0;
    padding:22px 20px calc(22px + var(--safe-bottom));
    max-height:88vh;
    overflow-y:auto;
    border-top:1px solid var(--border);
    animation:slideUp .18s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px); opacity:.4;} to{transform:translateY(0); opacity:1;}}
  .modal-handle{
    width:40px;height:4px;
    border-radius:2px;
    background:var(--border);
    margin:0 auto 16px;
  }
  .modal-title{
    font-size:19px;
    font-weight:800;
    margin:0 0 4px;
  }
  .modal-sub{
    font-size:13px;
    color:var(--text-dim);
    margin:0 0 18px;
  }
  .rub-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:6px;
  }
  .rub-tile{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:14px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    cursor:pointer;
    text-align:center;
  }
  .rub-tile .rub-icon{width:44px;height:44px;font-size:22px;}
