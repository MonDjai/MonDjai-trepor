  /* ===================== ÉCRAN PARTAGER (F8) ===================== */
  /* Génère, entièrement hors ligne (canvas natif du navigateur, sans
     bibliothèque externe), une image récapitulative du jour, de la
     semaine ou du mois -- à montrer au propriétaire du véhicule, au
     syndicat, ou à l'appui d'une demande de financement. */

  function computeDonneesPartage(periode){
    var now = new Date();
    if(periode === "semaine" || periode === "mois"){
      var range = periode === "mois" ? getMonthRange(now) : getWeekRange(now);
      var stats = computeEtatStats(range);
      var titre = periode === "mois"
        ? capitalize(MOIS_FR[now.getMonth()]) + " " + now.getFullYear()
        : "Du " + formatDateCourte(range.startDate) + " au " + formatDateCourte(range.endDate);
      return {
        periode: periode,
        titrePeriode: titre,
        hasData: stats.keys.length > 0,
        recette: stats.recetteTotale,
        recetteInconnue: false,
        chargesTotales: stats.chargesTotales,
        solde: stats.soldeCumule,
        parRubrique: stats.parRubrique,
        moyenne: stats.moyenne
      };
    }
    // periode === "jour"
    var key = todayKey();
    var j = state.jours[key] || { recette:null, charges:[] };
    var parRubrique = {};
    (j.charges || []).forEach(function(c){
      parRubrique[c.rubriqueId] = (parRubrique[c.rubriqueId] || 0) + c.montant;
    });
    var chargesTotales = (j.charges || []).reduce(function(s,c){ return s + c.montant; }, 0);
    var recette = j.recette;
    return {
      periode: "jour",
      titrePeriode: capitalize(formatDateLongue(now)),
      hasData: recette !== null || (j.charges && j.charges.length > 0),
      recette: recette || 0,
      recetteInconnue: recette === null,
      chargesTotales: chargesTotales,
      solde: (recette || 0) - chargesTotales,
      parRubrique: parRubrique
    };
  }

  function dessinerRectArrondi(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  var SHARE_FONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";

  function dessinerCartePartage(ctx, data){
    var W = SHARE_W, H = SHARE_H, pad = 64;

    var fond = ctx.createLinearGradient(0, 0, 0, H);
    fond.addColorStop(0, "#171b25");
    fond.addColorStop(1, "#0c0e13");
    ctx.fillStyle = fond;
    ctx.fillRect(0, 0, W, H);

    var y = pad + 34;

    // Marque
    ctx.fillStyle = "#f5a623";
    ctx.beginPath();
    ctx.arc(pad + 28, y - 8, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#11141a";
    ctx.font = "800 30px " + SHARE_FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("T", pad + 28, y - 6);
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left";

    ctx.fillStyle = "#f2f3f5";
    ctx.font = "800 34px " + SHARE_FONT;
    ctx.fillText("MonDjai/Trépor", pad + 68, y - 16);
    ctx.fillStyle = "#9aa0ac";
    ctx.font = "600 22px " + SHARE_FONT;
    ctx.fillText("Chaque jour compte", pad + 68, y + 14);

    y += 78;
    var seg = SEGMENTS.find(function(s){ return s.id === state.config.segment; });
    ctx.fillStyle = "#9aa0ac";
    ctx.font = "700 25px " + SHARE_FONT;
    var segLabel = seg ? (seg.emoji + " " + seg.nom + "  ·  ") : "";
    ctx.fillText(segLabel + data.titrePeriode, pad, y);

    y += 44;
    ctx.strokeStyle = "#2a2f3b";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
    y += 60;

    if(!data.hasData){
      ctx.fillStyle = "#666c78";
      ctx.font = "600 28px " + SHARE_FONT;
      ctx.textAlign = "center";
      ctx.fillText("Rien à partager pour cette période pour l'instant.", W/2, H/2);
      ctx.textAlign = "left";
      return;
    }

    var enPerte = data.solde < 0;
    var labelSolde = data.periode === "jour" ? "SOLDE NET DU JOUR"
      : data.periode === "semaine" ? "SOLDE NET DE LA SEMAINE"
      : "SOLDE NET DU MOIS";
    ctx.fillStyle = "#9aa0ac";
    ctx.font = "800 24px " + SHARE_FONT;
    ctx.fillText(labelSolde, pad, y);
    y += 74;
    ctx.fillStyle = enPerte ? "#ff6b5e" : "#34b37e";
    ctx.font = "900 88px " + SHARE_FONT;
    ctx.fillText(formatFCFA(data.solde), pad, y);
    y += 26;

    if(enPerte){
      y += 34;
      var texte = (data.periode === "jour" ? "Jour à perte" : "Période à perte") + " : " + formatFCFA(Math.abs(data.solde));
      ctx.font = "800 27px " + SHARE_FONT;
      var tw = ctx.measureText(texte).width;
      var bh = 56, bw = tw + 48;
      dessinerRectArrondi(ctx, pad, y - bh + 14, bw, bh, bh/2);
      ctx.fillStyle = "rgba(255,107,94,0.16)";
      ctx.fill();
      ctx.fillStyle = "#ff6b5e";
      ctx.textBaseline = "middle";
      ctx.fillText(texte, pad + 24, y - bh/2 + 14 + bh/2);
      ctx.textBaseline = "alphabetic";
      y += 40;
    } else {
      y += 30;
    }

    ctx.strokeStyle = "#2a2f3b";
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
    y += 56;

    var colW = (W - pad*2) / 2;
    ctx.fillStyle = "#9aa0ac";
    ctx.font = "800 22px " + SHARE_FONT;
    ctx.fillText(data.periode === "jour" ? "RECETTE" : "RECETTE TOTALE", pad, y);
    ctx.fillText(data.periode === "jour" ? "CHARGES" : "CHARGES TOTALES", pad + colW, y);
    y += 48;
    ctx.fillStyle = "#f2f3f5";
    ctx.font = "800 44px " + SHARE_FONT;
    ctx.fillText(data.recetteInconnue ? "—" : formatFCFA(data.recette), pad, y);
    ctx.fillText(formatFCFA(data.chargesTotales), pad + colW, y);

    if(data.periode !== "jour"){
      y += 62;
      ctx.fillStyle = "#9aa0ac";
      ctx.font = "800 22px " + SHARE_FONT;
      ctx.fillText("MOYENNE / JOUR", pad, y);
      y += 44;
      ctx.fillStyle = "#f2f3f5";
      ctx.font = "800 36px " + SHARE_FONT;
      ctx.fillText(formatFCFA(data.moyenne), pad, y);
    }

    y += 58;
    ctx.strokeStyle = "#2a2f3b";
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
    y += 54;

    ctx.fillStyle = "#f2f3f5";
    ctx.font = "800 29px " + SHARE_FONT;
    ctx.fillText("Charges par rubrique", pad, y);
    y += 50;

    var rubIds = Object.keys(data.parRubrique).sort(function(a,b){
      return data.parRubrique[b] - data.parRubrique[a];
    });
    var maxRows = 6;
    if(rubIds.length === 0){
      ctx.fillStyle = "#666c78";
      ctx.font = "600 25px " + SHARE_FONT;
      ctx.fillText("Aucune charge enregistrée.", pad, y);
      y += 42;
    } else {
      rubIds.slice(0, maxRows).forEach(function(id){
        var r = state.config.rubriques.find(function(x){ return x.id === id; });
        var nom = r ? r.nom : "Rubrique supprimée";
        var couleur = r ? r.couleur : "#7f8c9a";
        ctx.fillStyle = couleur;
        dessinerRectArrondi(ctx, pad, y - 22, 16, 16, 4);
        ctx.fill();
        ctx.fillStyle = "#f2f3f5";
        ctx.font = "600 27px " + SHARE_FONT;
        ctx.fillText(nom, pad + 30, y - 6);
        ctx.textAlign = "right";
        ctx.font = "700 27px " + SHARE_FONT;
        ctx.fillText(formatFCFA(data.parRubrique[id]), W - pad, y - 6);
        ctx.textAlign = "left";
        y += 44;
      });
      if(rubIds.length > maxRows){
        ctx.fillStyle = "#666c78";
        ctx.font = "600 23px " + SHARE_FONT;
        ctx.fillText("+ " + (rubIds.length - maxRows) + " autre(s) rubrique(s)", pad, y);
        y += 40;
      }
    }

    var footY = H - 74;
    ctx.strokeStyle = "#2a2f3b";
    ctx.beginPath(); ctx.moveTo(pad, footY - 26); ctx.lineTo(W - pad, footY - 26); ctx.stroke();
    ctx.fillStyle = "#666c78";
    ctx.font = "500 21px " + SHARE_FONT;
    ctx.fillText("Récapitulatif généré automatiquement à partir des données saisies — document informatif.", pad, footY + 6);
    ctx.fillText("Créé le " + formatDateCourte(new Date()) + " avec MonDjai/Trépor", pad, footY + 34);
  }

  function nomFichierPartage(periode){
    return "trepor_" + periode + "_" + todayKey() + ".png";
  }

  function creerCanvasPartage(periode){
    var canvas = document.createElement("canvas");
    canvas.width = SHARE_W;
    canvas.height = SHARE_H;
    dessinerCartePartage(canvas.getContext("2d"), computeDonneesPartage(periode));
    return canvas;
  }

  function telechargerBlob(blob, nomFichier){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = nomFichier;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function telechargerImagePartage(periode){
    var canvas = creerCanvasPartage(periode);
    canvas.toBlob(function(blob){
      if(!blob){ showToast("Impossible de générer l'image sur cet appareil."); return; }
      telechargerBlob(blob, nomFichierPartage(periode));
      showToast("Image téléchargée.");
    }, "image/png", 0.95);
  }

  function partagerImagePartage(periode){
    var canvas = creerCanvasPartage(periode);
    canvas.toBlob(function(blob){
      if(!blob){ showToast("Impossible de générer l'image sur cet appareil."); return; }
      var fichier = null;
      try{ fichier = new File([blob], nomFichierPartage(periode), { type:"image/png" }); }catch(e){ fichier = null; }
      if(fichier && navigator.share && navigator.canShare && navigator.canShare({ files:[fichier] })){
        navigator.share({ files:[fichier], title:"MonDjai/Trépor", text:"Mon état — MonDjai/Trépor" })
          .catch(function(){ /* partage annulé, rien à faire */ });
      } else {
        telechargerBlob(blob, nomFichierPartage(periode));
        showToast("Image téléchargée (partage direct indisponible sur cet appareil).");
      }
    }, "image/png", 0.95);
  }

  function renderPartager(){
    var periode = ui.partagerPeriode || "jour";
    var data = computeDonneesPartage(periode);

    var html = '' +
      '<div class="home-header">' +
        '<div class="home-header-row">' +
          '<div class="home-greet">📤 Partager</div>' +
          '<button class="icon-btn" id="btn-reglages" aria-label="Réglages">⚙️</button>' +
        '</div>' +
      '</div>' +
      '<div class="seg-toggle">' +
        '<button class="seg-btn '+(periode==="jour"?"active":"")+'" data-partage-periode="jour">Jour</button>' +
        '<button class="seg-btn '+(periode==="semaine"?"active":"")+'" data-partage-periode="semaine">Semaine</button>' +
        '<button class="seg-btn '+(periode==="mois"?"active":"")+'" data-partage-periode="mois">Mois</button>' +
      '</div>' +
      '<div class="share-preview-wrap"><canvas id="partage-canvas" width="'+SHARE_W+'" height="'+SHARE_H+'"></canvas></div>' +
      '<div class="share-actions">' +
        '<button class="btn btn-primary" id="btn-partager" '+(data.hasData?"":"disabled")+'>📤 Partager</button>' +
        '<button class="btn btn-ghost" id="btn-telecharger-image" '+(data.hasData?"":"disabled")+'>⬇️ Télécharger l\'image</button>' +
      '</div>' +
      renderTabBarHtml("partager");

    app.innerHTML = html;

    var canvas = document.getElementById("partage-canvas");
    if(canvas) dessinerCartePartage(canvas.getContext("2d"), data);

    var reglagesBtnPartage = document.getElementById("btn-reglages");
    if(reglagesBtnPartage) reglagesBtnPartage.addEventListener("click", function(){
      ui.overlay = "reglages";
      render();
    });
    app.querySelectorAll("[data-partage-periode]").forEach(function(node){
      node.addEventListener("click", function(){
        ui.partagerPeriode = node.getAttribute("data-partage-periode");
        renderPartager();
      });
    });
    var btnShare = document.getElementById("btn-partager");
    if(btnShare) btnShare.addEventListener("click", function(){ partagerImagePartage(periode); });
    var btnDownload = document.getElementById("btn-telecharger-image");
    if(btnDownload) btnDownload.addEventListener("click", function(){ telechargerImagePartage(periode); });

    attachTabBarEvents();
  }


  /* ---------- Démarrage ---------- */

  // Sprint 5A : le bouton/geste "retour" du téléphone doit naviguer dans l'appli, pas la fermer.
  window.addEventListener("popstate", function(){
    if(suppressNextPopstate){ suppressNextPopstate = false; return; }
    historyArmed = false;
    handleBackNavigation();
  });
  // Beaucoup d'actions (ouvrir/fermer un modal, changer d'onglet, avancer dans l'assistant
  // objectif...) passent par un rendu partiel (renderModal, renderObjectif...) plutôt que par
  // render() au complet. Plutôt que d'aller ajouter syncHistoryForBack() à chaque endroit, on la
  // relance après chaque clic (une fois les gestionnaires synchrones terminés) : elle regarde
  // simplement l'état actuel de l'écran et arme/désarme l'historique en conséquence.
  document.addEventListener("click", function(){ setTimeout(syncHistoryForBack, 0); }, true);

  state = loadState();
  ui.locked = !!(state.config.pinActif && state.config.pinCode);
  render();
  verifierRappelSauvegarde();

  // Service worker (mode hors ligne)
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
